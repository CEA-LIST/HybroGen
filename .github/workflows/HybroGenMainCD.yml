name: CD

on:
  workflow_run:
    workflows: ["HybroGen_CI_Workflow"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success'  && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'HybroGen_CI/CD_Developpment') }}
    runs-on: ubuntu-22.04

    strategy:
        matrix:
            port: [60000, 65000, 65001,65002,65003]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        run: |
          gh run download ${{ github.event.workflow_run.id }} -n hybrogen-artifacts -D artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move artifacts
        run: |
          rm -rf ./HybroGen ./HybroLang
          mv artifacts/generated/HybroGen ./HybroGen
          mv artifacts/generated/HybroLang ./HybroLang
          rm -rf artifacts/
          ls

      - name: Clean machine
        uses: appleboy/ssh-action@v1
        with:
          host: home.hpch.net
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          script: |
            rm -rf ~/FromCD
            mkdir ~/FromCD

      - name: Copy artifacts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: home.hpch.net
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          source: "."
          target: "~/FromCD/"