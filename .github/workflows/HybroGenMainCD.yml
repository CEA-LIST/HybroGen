name: HybroGen_CD_Workflow

on:
  workflow_call:


jobs:
  deploy:
    runs-on: ubuntu-24.04

    strategy:
        matrix:
            port: [60000, 65000, 65001,65002,65003]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ANTLR4 via apt
        run: |
          sudo apt update          
          sudo apt install -y antlr4    
          VERSION=$(antlr4 2>/dev/null | grep 'ANTLR Parser Generator' | awk '{print $5}')
          sudo apt install -y python3-antlr4
          python -m pip install --upgrade pip
          python -m pip install antlr4-python3-runtime==${VERSION}
          python -m pip install psycopg2-binary 

      - name: Download artifacts
        run: |
          gh run download ${{ github.event.workflow_run.id }} -n hybrogen-artifacts -D artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move artifacts
        run: |
          rm -rf ./HybroGen ./HybroLang
          mv artifacts/generated/HybroGen ./HybroGen
          mv artifacts/generated/HybroLang ./HybroLang
          rm -rf artifacts/
          ls

      - name: Build C file
        run: |
          cd ./Demos
          cd ./Stencil/ && make buildAll
          cd ../VectorMatrix && make buildAll
          cd ../Newton-SquareRoot-VariablePrecision && make buildAll


      - name: Debug secrets
        run: |
          echo "HOST=${{secrets.SSH_ADDR_DEST}}"
      - name: Clean machine
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_ADDR_DEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          script: |
            rm -rf ~/FromCD
            mkdir ~/FromCD

      - name: Copy artifacts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDR_DEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          source: "./Demos"
          target: "~/FromCD/"