name: HybroGen_CD_Workflow

on:
  workflow_run:
    workflows: ["HybroGen_CI_Workflow"]
    types: [completed]

jobs:
  deploy:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-24.04

    strategy:
        matrix:
            port: [60000, 65000, 65001,65002,65003]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        run: |
          gh run download ${{ github.event.workflow_run.id }} -n hybrogen-artifacts -D artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move artifacts
        run: |
          rm -rf ./HybroGen ./HybroLang
          mv artifacts/generated/HybroGen ./HybroGen
          mv artifacts/generated/HybroLang ./HybroLang
          rm -rf artifacts/
          ls

      - name: Build C file
        run: |
          cd ./Demos/Stencil/ && make buildAll
          cd ./Demos/VectorMatrix && make buildAll
          cd ./Demos/Newton-SquareRoot-VariablePrecision && make buildAll

      - name: Clean machine
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_ADDR_DEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          script: |
            rm -rf ~/FromCD
            mkdir ~/FromCD

      - name: Copy artifacts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDR_DEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ matrix.port }}
          source: "./Demos"
          target: "~/FromCD/"