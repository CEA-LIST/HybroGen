name: CI Test

on:
  push:
    branches:
      - ci-test
  pull_request:
    branches:
      - ci-test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/Checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # to change