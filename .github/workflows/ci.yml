name: CI Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  build-toolschains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/Checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # to change

      - name: Install QEMU dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            pkg-config

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchain-${{ hashFiles('GenCrossTools.py') }}

      - name: Build toolchains
        run: |
          mkdir -p toolchains
          python GenCrossTools.py -a aarch64 -p toolchains -w toolchains
          python GenCrossTools.py -a riscv  -p toolchains -w toolchains
          python GenCrossTools.py -a power  -p toolchains -w toolchains         
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchains
          path: toolchains

  build-grammar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/Checkout@v4
      - name: Install ANTLR4 via apt
        run: |
          sudo apt update
          sudo apt install -y antlr4      
      - name: LaunchConstruction
        run: | 
            make buildGrammar



  regression-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/Checkout@v4
    - name: Regression test on each arch
      run: |
        make aarch64 riscv power

