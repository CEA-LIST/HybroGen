name: HybroGen_CI_Workflow


# https://docs.github.com/fr/actions
on:
  push: # on push branch main and on push CI CD branch developpment
    branches:
      - 'main'
      - 'HybroGen_CI/CD_Developpment'
  pull_request: # on pull request on main branch
    branches:
      - 'main'

jobs:


  #######################################################################################
  ###################### Building of HybroGen ###########################################
  #######################################################################################
  build-toolschains:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [aarch64, riscv, power]
    steps:
    
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # to change

      - name: Install QEMU dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            pkg-config 
            sudo apt install -y libc6

      - name: Restore cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ./${{matrix.architecture}}
          key: ${{matrix.architecture}}-${{ hashFiles('GenCrossTools.py') }}

      - name: Build toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          TOOLCHAIN_DIR: ${{ github.workspace }}/
        run: |
          python GenCrossTools.py -a ${{matrix.architecture}}  -p "$TOOLCHAIN_DIR" -w "$TOOLCHAIN_DIR/"
          python GenCrossTools.py -a ${{matrix.architecture}}  -p "$TOOLCHAIN_DIR" -w "$TOOLCHAIN_DIR/" -s

      - name: Check bashrc
        run: |
          test -e ./${{matrix.architecture}}/.bashrc

      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.architecture}}
          path: ./${{matrix.architecture}}
          include-hidden-files: true
          if-no-files-found: error

  build-grammar-and-dataBase:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrogen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create hybrogen dataBase and schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d hybrogen <<EOF
          CREATE USER hybrogen WITH PASSWORD 'hybrogen';
          GRANT ALL PRIVILEGES ON DATABASE hybrogen TO hybrogen;
          CREATE SCHEMA IF NOT EXISTS hybrogen AUTHORIZATION hybrogen;
          EOF
      
      - name: Install ANTLR4 via apt
        run: |
          sudo apt update          
          sudo apt install -y antlr4      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Get ANTLR version
        id: antlr-version
        run: |
          VERSION=$(antlr4 2>/dev/null | grep 'ANTLR Parser Generator' | awk '{print $5}')
          echo "ANTLR version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Install ANTLR4 for H2ISA
        run: | # BE CAREFUL antlr4-python3-runtime==4.7.2 Doit etre tenu a jour ou trouver une manière de synchroniser antlr4 version et antlr4 python runtime
          sudo apt update
          sudo apt install -y python3-antlr4
          python -m pip install --upgrade pip
          python -m pip install antlr4-python3-runtime==${VERSION}
          python -m pip install psycopg2-binary

      - name: LaunchConstruction
        run: | 
            make buildGrammar
      
      - name: builded file present 
        run: |
            test -f ./HybroGen/IsaDescriptionLexer.py
            test -f ./HybroGen/IsaDescriptionParser.py

            
      - name: Try import
        run: |
          python -c "from HybroGen.IsaDescriptionLexer import IsaDescriptionLexer"
          python -c "from HybroGen.IsaDescriptionParser import IsaDescriptionParser"

      - name: make Db
        run: |
          make DbPopulate

      - name: Dump database
        env:
          PGUSER: hybrogen
          PGPASSWORD: hybrogen
        run: |
          mkdir -p artifacts
          pg_dump -h localhost > artifacts/hybrogen.sql

      - name: Copy generated code
        run: |
          mkdir -p artifacts/generated
          cp -r ./HybroGen artifacts/generated/
          cp -r ./HybroLang artifacts/generated/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hybrogen-artifacts
          path: artifacts/
          if-no-files-found: error

  #######################################################################################
  ###################### Regression test ################################################
  #######################################################################################

  regression-test:
    runs-on: ubuntu-24.04
    needs: [build-toolschains,build-grammar-and-dataBase] 
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hybrogen
          POSTGRES_PASSWORD: hybrogen
          POSTGRES_DB: hybrogen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hybrogen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        architecture: [aarch64, riscv, power]
    steps:
      
    - name: Checkout repo
      uses: actions/checkout@v4

    
    - name: Install ANTLR4 via apt
      run: |
        sudo apt update          
        sudo apt install -y antlr4      
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Get ANTLR version
      id: antlr-version
      run: |
        VERSION=$(antlr4 2>/dev/null | grep 'ANTLR Parser Generator' | awk '{print $5}')
        echo "ANTLR version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
  

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{matrix.architecture}}
        path: ./${{matrix.architecture}}

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: hybrogen-artifacts
        path: ./artifacts

    - name: Move artifacts
      run: |
        rm -rf ./HybroGen ./HybroLang
        mv artifacts/generated/HybroGen ./
        mv artifacts/generated/HybroLang ./

    - name: Restore database
      env:
        PGPASSWORD: hybrogen
      run: |
        until pg_isready -h localhost -p 5432 -U hybrogen; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        psql -h localhost -U hybrogen -d hybrogen < artifacts/hybrogen.sql

    - name: Regression test on ${{matrix.architecture}}
      env:
        BASH_ENV: ./${{matrix.architecture}}/.bashrc
      run: |
        sudo apt update
        sudo apt install -y python3-antlr4
        python -m pip install --upgrade pip
        python -m pip install antlr4-python3-runtime==${VERSION}
        python -m pip install psycopg2-binary
        chmod -R +x ./${{matrix.architecture}}/
        make ${{matrix.architecture}}

  #######################################################################################
