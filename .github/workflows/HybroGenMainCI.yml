    - name: Install ANTLR4 via apt
      run: |
        sudo apt update          
        sudo apt install -y antlr4      
        
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        
    - name: Get ANTLR version
      id: antlr-version
      run: |
        VERSION=$(antlr4 2>/dev/null | grep 'ANTLR Parser Generator' | awk '{print $5}')
        echo "ANTLR version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
  

    - name: Download artifact #Download toolchains
      uses: actions/download-artifact@f99b3e3d1560723c9a3e30e653411513bc69cedb
      with:
        name: ${{matrix.architecture}}
        path: ./${{matrix.architecture}}/

    - name: Download artifacts #Download dataBase and Grammar build
      uses: actions/download-artifact@f99b3e3d1560723c9a3e30e653411513bc69cedb
      with:
        name: hybrogen-artifacts
        path: ./artifacts

    - name: Move artifacts #Replace repo old directory by the artifacts
      run: |
        rm -rf ./HybroGen ./HybroLang
        mv artifacts/generated/HybroGen ./
        mv artifacts/generated/HybroLang ./

    - name: Stencil test on ${{matrix.architecture}} #Launch demo stencil on qemu matrix.architecture 
      env:
        BASH_ENV: ${{ github.workspace }}/${{matrix.architecture}}/.bashrc
      run: |
        sudo apt update
        sudo apt install -y python3-antlr4
        sudo apt install -y sqlite3 libsqlite3-dev
        python -m pip install --upgrade pip
        python -m pip install antlr4-python3-runtime==${VERSION}
        chmod -R +x ./${{matrix.architecture}}/
        cd ./Demos/Stencil && make all${{matrix.architecture}}Qemu

  #######################################################################################
  ###################### Demo Vector Matrix #############################################
  #######################################################################################


  demo-vectorMatrix: #Job to launch demo VectorMatrix and check if result are good on qemu
    runs-on: ubuntu-24.04
    needs: [regression-test] 

    #Strategy to launch multiple vm per architecture to launch all VectorMatrix demo on each arch "simultaniously"

    strategy:
      matrix:
        architecture: [aarch64, riscv, power]
