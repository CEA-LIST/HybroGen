  #######################################################################################
  ###################### Launch CD For deployment #######################################
  #######################################################################################

  launch_CD: # this Job has to launch CD 
    needs: [demo-NewtonSquareRoot,demo-stencil,demo-vectorMatrix]
    uses: ./.github/workflows/HybroGenMainCD.yml
    secrets: inherit #Secret Heritage
    #CD can't make the CI fail
    if: success() || failure()  
    

